# Netlify build config for the DPGLF platform.
# The repo root IS the Next.js app, so there is no base directory.
#
# This file is committed, so no secret values live here. Every variable from
# .env.local is set in the Netlify UI and marked "Contains secret values";
# SECRETS_SCAN_OMIT_KEYS below lists the ones that are not actually secret, so
# the secrets scanner does not fail the build when their values legitimately
# appear in build output (e.g. NEXT_PUBLIC_* in the browser bundle, "900").
# The real secrets: DATABASE_URL, DATABASE_URL_DIRECT, AUTH_SECRET,
# CLOUDFLARE_ACCESS_KEY_ID, CLOUDFLARE_SECRET_ACCESS_KEY, RESEND_API_KEY,
# CRON_KEY, EMOWORLD_SYNC_SECRET.

[build]
  command = "pnpm build"
  publish = ".next"

# The Next.js Runtime turns the app into serverless functions so dynamic routes
# (every dashboard page, the archive, /media/*) actually run. Without it Netlify
# would serve the raw .next folder as static files.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # 22, not 20: the Neon driver's transactions need a global WebSocket, which
  # Node only ships unflagged from 22. Netlify runs functions on this version too.
  NODE_VERSION = "22"
  # Public identity, set here rather than in the UI: NEXT_PUBLIC_* values are
  # baked in at build time (email links, sitemap, OG tags), so they must be
  # right on the very first build. Not secrets.
  NEXT_PUBLIC_SITE_URL = "https://gwatidzo.me"
  NEXT_PUBLIC_SITE_NAME = "Dr. Phillip Gwatidzo Literary Foundation"
  # Whitelist non-secret config from the secrets scanner: these values are
  # low-entropy and legitimately appear in build output.
  SECRETS_SCAN_OMIT_KEYS = "ACCESS_TTL,REFRESH_TTL,CLOUDFLARE_ACCOUNT_ID,CLOUDFLARE_BUCKET_NAME,CLOUDFLARE_PUBLIC_URL,EMAIL_FROM,FOUNDATION_INBOX,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SITE_NAME,EMOWORLD_SYNC_ENABLED,EMOWORLD_API_BASE"

# Manuscripts and other private objects must never be cached by a CDN.
[[headers]]
  for = "/api/files/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow"
